document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

cells = days.map((c, i) => {\n        const [cd, ci, co] = c; const tot = cd + ci + co;\n        dr += cd; inb += ci; out += co;\n        const lines = [];\n        if (cd > 0) lines.push(cd + 'dr');\n        if (ci > 0) lines.push(ci + 'in');\n        if (co > 0) lines.push(co + 'out');\n        return {\n          cls: 'plw-cell' + (i === todayIdx ? ' plw-cell-today' : ''),\n          lines,\n          total: tot > 0 ? String(tot) : '—',\n          totcls: tot > 0 ? 'plw-tot' : 'plw-tot plw-tot-dim',\n        };\n      });\n      const tot = dr + inb + out;\n      return {\n        name, cells,\n        dr: dr > 0 ? dr : '—', in: inb > 0 ? inb : '—', out: out > 0 ? out : '—', tot: tot > 0 ? tot : '—',\n        drcls: dr > 0 ? 'plw-wknum' : 'plw-dim', incls: inb > 0 ? 'plw-wknum' : 'plw-dim', outcls: out > 0 ? 'plw-wknum' : 'plw-dim',\n      };\n    });\n\n    // ── Hourly breakdown (compact view) ──\n    const hourlyRaw = [\n      { hour: '5am', appts: 3, req: '4.5', avail: '6.0', staffed: '5', adj: '0', final: 1.5, cumul: 1.5 },\n      { hour: '6am', appts: 9, req: '13.5', avail: '13.5', staffed: '11', adj: '0', final: 0.0, cumul: 1.5 },\n      { hour: '7am', appts: 15, req: '22.5', avail: '21.0', staffed: '17', adj: '-0.5', final: -2.0, cumul: -0.5 },\n      { hour: '8am', appts: 16, req: '24.0', avail: '24.0', staffed: '19', adj: '0', final: 0.0, cumul: -0.5 },\n      { hour: '9am', appts: 14, req: '21.0', avail: '22.5', staffed: '18', adj: '0', final: 1.5, cumul: 1.0 },\n      { hour: '10am', appts: 12, req: '18.0', avail: '19.5', staffed: '16', adj: '0', final: 1.5, cumul: 2.5 },\n    ];\n    const fmtD = v => (v >= 0 ? '+' + v.toFixed(1) : v.toFixed(1));\n    const hourlyRows = hourlyRaw.map(h => ({\n      hour: h.hour, appts: h.appts, req: h.req, avail: h.avail, staffed: h.staffed, adj: h.adj,\n      final: fmtD(h.final), cumul: fmtD(h.cumul),\n      rowcls: h.final < 0 ? 'ht-deficit' : '',\n      finalcls: h.final < 0 ? 'ht-neg' : 'ht-pos',\n      cumulcls: h.cumul < 0 ? 'ht-neg' : 'ht-pos',\n    }));\n\n    // ── Roster lanes (7) ──\n    const mk = (name, role, shift, av, timeoff) => ({\n      name, role, shift: shift || '', avcls: 'emp-avatar av' + av,\n      initials: this.initials(name), timeoff: !!timeoff, normal: !timeoff,\n    });\n    const s1 = '5:00am – 1:00pm', mid = '9:00am – 5:00pm', s2 = '1:00pm – 9:00pm', s3 = '10:00pm – 6:00am';\n    const lanes = [\n      { title: '1st Shift', count: 8, emps: [\n        mk('Dean Dioguardi','Lead',s1,2), mk('Marcus Webb','Forklift',s1,0), mk('Tyrone Hicks','Dock',s1,5),\n        mk('Jamal Carter','Receiver',s1,1), mk('Luis Ortega','Forklift',s1,3), mk('Brandon Pruitt','Associate',s1,4),\n        mk('Devin Cole','Dock',s1,6), mk('Anthony Rosales','Shipping',s1,2) ] },\n      { title: 'Mid Shift', count: 5, emps: [\n        mk('Kayla Brennan','Lead',mid,4), mk('Sergio Diaz','Forklift',mid,0), mk('Marcus Lane','Associate',mid,1),\n        mk('Tre Watkins','Dock',mid,5), mk('Omar Salinas','Receiver',mid,3) ] },\n      { title: '2nd Shift', count: 7, emps: [\n        mk('Rick Vandenberg','Lead',s2,6), mk('Cody Schmidt','Forklift',s2,3), mk('Darnell Pope','Dock',s2,2),\n        mk('Victor Reyes','Associate',s2,0), mk('Jared Knapp','Shipping',s2,1), mk('Malik Turner','Associate',s2,4),\n        mk('Phil Esposito','Dock',s2,5) ] },\n      { title: '3rd Shift', count: 4, emps: [\n        mk('Greg Halverson','Lead',s3,1), mk('Tony Marquez','Forklift',s3,0), mk('Shaun Riley','Dock',s3,6),\n        mk('Beto Guerra','Associate',s3,3) ] },\n      { title: 'PTO', count: 2, emps: [ mk('Hannah Wozniak','PTO','',4,true), mk('Dexter Lamb','PTO','',2,true) ] },\n      { title: 'Call-In', count: 1, emps: [ mk('Russ Pawlak','Call-In','',5) ] },\n      { title: 'Special Project', count: 1, emps: [ mk('Eddie Nava','Relabel — Aisle 4',s1,0) ] },\n    ];\n\n    // ── Appointment list ──\n    const tcls = t => t === 'Inbound' ? 'alt-badge alt-in' : 'alt-badge alt-out';\n    const apptsRaw = [\n      { code: 'KEN-24817', type: 'Inbound', time: '6:00 AM', notes: 'Birchwood Foods — 2 trailers, dock 3' },\n      { code: 'KEN-24820', type: 'Outbound', time: '7:30 AM', notes: 'Crown Bakeries pickup' },\n      { code: 'KEN-24834', type: 'Inbound', time: '8:00 AM', notes: 'Richelieu raw materials' },\n      { code: 'KEN-24841', type: 'Outbound', time: '8:45 AM', notes: '' },\n      { code: 'KEN-24852', type: 'Inbound', time: '9:15 AM', notes: 'Fair Oaks Farms — refrigerated' },\n      { code: 'KEN-24860', type: 'Outbound', time: '10:00 AM', notes: 'BossBites — 4 LTL' },\n      { code: 'KEN-24871', type: 'Outbound', time: '10:30 AM', notes: 'Crown Bakeries' },\n      { code: 'KEN-24888', type: 'Inbound', time: '11:30 AM', notes: 'Pretzilla — appt confirmed' },\n      { code: 'KEN-24902', type: 'Outbound', time: '12:15 PM', notes: '' },\n      { code: 'KEN-24915', type: 'Outbound', time: '1:00 PM', notes: 'Richelieu Kenosha' },\n      { code: 'KEN-24927', type: 'Inbound', time: '2:00 PM', notes: 'Birchwood Foods' },\n      { code: 'KEN-24939', type: 'Outbound', time: '3:30 PM', notes: 'BossBites — will-call' },\n    ];\n    const appts = apptsRaw.map(a => ({ ...a, badgecls: tcls(a.type), type: a.type === 'Inbound' ? 'In' : 'Out' }));\n\n    // ── Customer Snapshot ──────────────────────────────────────────────\n    // DATA SOURCE: each customer has a typical same-weekday profile per type\n    // (Inbound / Outbound / Drops, Mon..Sun). From those profiles we generate 8\n    // weeks of history deterministically, so the Normal baseline (median/mean)\n    // has a real, internally-consistent source instead of hand-typed numbers.\n    // profile[type][dayIdx] = typical count for that weekday.\n    const profiles = {\n      'Crown Bakeries':                  { in:[2,2,2,2,3,1,0], out:[9,11,10,14,12,3,0], dr:[4,5,6,7,6,2,0], spike:true },\n      'Pretzilla Kenosha':               { in:[3,4,3,4,5,1,0], out:[6,7,8,8,9,1,0],     dr:[4,3,4,5,4,1,0], spike:false },\n      'Birchwood Foods Kenosha':         { in:[2,3,2,3,4,1,0], out:[5,6,5,6,7,2,0],     dr:[10,11,9,12,11,3,1], spike:true },\n      'Fair Oaks Farms':                 { in:[1,1,1,1,2,0,0], out:[3,4,3,4,5,1,0],     dr:[6,7,6,8,7,2,0], spike:false },\n      'Richelieu Kenosha':               { in:[2,2,2,2,3,1,0], out:[4,5,4,5,6,1,0],     dr:[7,8,7,9,8,2,0], spike:false },\n      'Richelieu Raw Materials Kenosha': { in:[1,1,1,1,2,0,0], out:[2,3,2,3,3,0,0],     dr:[2,2,3,2,3,0,0], spike:false },\n      'BossBites':                       { in:[1,2,2,2,3,0,0], out:[1,2,2,2,3,0,0],     dr:[10,12,11,13,12,3,0], spike:true },\n    };\n    const custNames = Object.keys(profiles);\n    const NWEEKS = 8, currentWeek = 7;\n    const weekRanges = ['May 4 – 10','May 11 – 17','May 18 – 24','May 25 – 31','Jun 1 – 7','Jun 8 – 14','Jun 15 – 21','Jun 22 – 28'];\n    const tnames = { in:'Inbound', out:'Outbound', dr:'Drops' };\n    const allTypes = [['in','Inbound'],['out','Outbound'],['dr','Drops']];\n\n    // deterministic per-series sampler (stable across renders)\n    const fnv = (str) => { let h = 2166136261; for (let k=0;k<str.length;k++){ h^=str.charCodeAt(k); h=Math.imul(h,16777619);} return h>>>0; };\n    const samples = (cust, type, day, t, spike) => {\n      let st = fnv(cust+'|'+type+'|'+day);\n      const next = () => { st = (Math.imul(st,1664525)+1013904223)>>>0; return st/4294967296; };\n      const out = [];\n      for (let w=0; w<NWEEKS; w++) {\n        let v = t;\n        if (t > 0) v = Math.max(0, t + Math.round((next()*2-1) * Math.max(1, t*0.18)));\n        out.push(v);\n      }\n      if (spike && t >= 4) out[Math.floor(next()*NWEEKS)] = Math.round(t*2.6); // one spike week\n      return out;\n    };\n\n    // ── Tweak props ──\n    const method   = this.props.baselineMethod ?? 'Median';\n    const avgMode  = this.props.avgWindow ?? '8-week';\n    const bigThreshold = this.props.bigCustomerThreshold ?? 25;\n    const showToday = this.props.showTodayHighlight ?? true;\n    const greenT = this.props.greenThreshold ?? 100;\n    const amberT = this.props.amberThreshold ?? 70;\n    const accent = this.props.snapshotAccent ?? '#2f7d57';\n    const methodLabel = method === 'Median' ? 'Median' : method === 'Trimmed' ? 'Trim' : 'Mean';\n    const methodWord  = method === 'Median' ? 'median' : method === 'Trimmed' ? 'trimmed mean' : 'mean';\n\n    const stat = (arr) => {\n      const a = [...arr].sort((x,y)=>x-y); const n = a.length;\n      if (method === 'Median') return n % 2 ? a[(n-1)/2] : (a[n/2-1]+a[n/2])/2;\n      if (method === 'Trimmed' && n >= 4) { const tt = a.slice(1,-1); return tt.reduce((p,v)=>p+v,0)/tt.length; }\n      return arr.reduce((p,v)=>p+v,0)/arr.length;\n    };\n    const winFor = (cust) => {\n      if (avgMode === '4-week') return 4;\n      if (avgMode === '8-week') return 8;\n      const p = profiles[cust] || profiles['Crown Bakeries'];\n      const vol = ['in','out','dr'].reduce((a,tk)=>a+p[tk].reduce((x,y)=>x+y,0),0);\n      return vol >= bigThreshold ? 8 : 4;\n    };\n\n    const selTypes = s.selTypes || [];\n    const effTypes = selTypes.length ? selTypes : ['in','out','dr'];\n    const selWeek = s.selWeek ?? currentWeek;\n    const todayActive = showToday && selWeek === currentWeek;\n\n    const buildCard = (cust, idx) => {\n      const prof = profiles[cust] || profiles['Crown Bakeries'];\n      const cCls = (i) => 'sn-cell' + (todayActive && i === todayIdx ? ' today' : '');\n      const thCls = (i) => 'sn-th' + (todayActive && i === todayIdx ? ' today' : '');\n      const perDay = [0,1,2,3,4,5,6].map(d => {\n        const tSeries = effTypes.map(tk => samples(cust, tk, d, prof[tk][d], prof.spike));\n        const series = [];\n        for (let w=0; w<NWEEKS; w++) series.push(tSeries.reduce((a,ts)=>a+ts[w],0));\n        return { series, sched: series[selWeek] };\n      });\n      const winList = avgMode === 'Both' ? [4,8] : [winFor(cust)];\n      const normalArr = (win) => perDay.map(p => {\n        let h = p.series.slice(Math.max(0, selWeek - win), selWeek);\n        if (!h.length) h = [p.series[selWeek]];\n        return Math.round(stat(h));\n      });\n      const baseArrs = winList.map(normalArr);\n      const rows = [];\n      winList.forEach((win, k) => rows.push({ label: methodLabel + ' · ' + win + '-wk', rowcls: '', cells: baseArrs[k].map((v,i)=>({ val:v, cls:cCls(i) })) }));\n      rows.push({ label: 'Scheduled', rowcls: '', cells: perDay.map((p,i)=>({ val:p.sched, cls:cCls(i) })) });\n      const primary = baseArrs[baseArrs.length-1];\n      rows.push({ label: '% of Normal', rowcls: 'sn-divide', cells: perDay.map((p,i)=>{\n        const n = primary[i]; let val, pcls;\n        if (n === 0) { val = '—'; pcls = 'pct-dim'; }\n        else { const v = Math.round(p.sched / n * 100); val = v + '%'; pcls = v >= greenT ? 'pct-green' : v < amberT ? 'pct-amber' : ''; }\n        return { val, cls: 'sn-cell sn-pct ' + pcls + (todayActive && i === todayIdx ? ' today' : '') };\n      }) });\n      const headCells = ['M','T','W','Th','F','Sa','Su'].map((d,i)=>({ label:d, cls:thCls(i) }));\n      const typeText = selTypes.length ? effTypes.map(tk=>tnames[tk]).join(' + ').toUpperCase() : 'TOTAL';\n      // per-card type-to-narrow combobox\n      const open = s.cardOpen[idx], query = s.cardQuery[idx];\n      const ql = (query || '').trim().toLowerCase();\n      const filtered = (ql === '' ? custNames : custNames.filter(n=>n.toLowerCase().includes(ql))).map(n=>({\n        label: n, cls: 'snap-opt' + (n === cust ? ' on' : ''),\n        onSelect: (e) => { if (e && e.preventDefault) e.preventDefault();\n          const cc=[...s.cardCust]; cc[idx]=n; const co=[...s.cardOpen]; co[idx]=false; const cq=[...s.cardQuery]; cq[idx]='';\n          this.setState({ cardCust:cc, cardOpen:co, cardQuery:cq }); },\n      }));\n      const winLbl = winList[winList.length-1];\n      return {\n        accentStyle: { '--sn-accent': accent, '--sn-accent-bg': accent + '1f' },\n        head: cust.toUpperCase() + ' — ' + typeText,\n        sub: 'Week of ' + weekRanges[selWeek] + ', 2026',\n        headCells, rows,\n        note: 'Normal = ' + methodWord + ' of the prior ' + winLbl + ' weeks (same weekday). Method is set in Tweaks.',\n        custInputVal: open ? query : cust, custPlaceholder: cust, custOpen: open,\n        filtered, noMatch: filtered.length === 0,\n        onFocus: (e) => { const co=[...s.cardOpen]; co[idx]=true; const cq=[...s.cardQuery]; cq[idx]=''; this.setState({ cardOpen:co, cardQuery:cq }); if (e && e.target) e.target.select(); },\n        onInput: (e) => { const cq=[...s.cardQuery]; cq[idx]=e.target.value; const co=[...s.cardOpen]; co[idx]=true; this.setState({ cardQuery:cq, cardOpen:co }); },\n        onBlur: () => { setTimeout(() => { const co=[...s.cardOpen]; co[idx]=false; this.setState({ cardOpen:co }); }, 150); },\n      };\n    };\n\n    const cards = [buildCard(s.cardCust[0], 0), buildCard(s.cardCust[1], 1)];\n    const typeChips = allTypes.map(([k,label]) => ({\n      label, cls: 'type-chip' + (selTypes.includes(k) ? ' on' : ''),\n      onClick: () => { const cur = selTypes.includes(k) ? selTypes.filter(x=>x!==k) : [...selTypes, k]; this.setState({ selTypes: cur }); },\n    }));\n    const weekOptions = weekRanges.map((r,i)=>({ value: String(i), label: (i===currentWeek?'This week · ':'') + r, selected: i===selWeek })).reverse();\n    const onWeek = (e) => this.setState({ selWeek: parseInt(e.target.value, 10) });\n\n    return {\n      isKen, notKen: !isKen, isDaily, isWeekly: !isDaily,\n      stubCode: { all: 'ALL', cal: 'CAL', wr: 'WR', mad: 'MAD', ec: 'EC' }[s.facility] || s.facility.toUpperCase(),\n      facilities,\n      dailyTabCls: 'view-tab' + (isDaily ? ' active' : ''),\n      weeklyTabCls: 'view-tab' + (!isDaily ? ' active' : ''),\n      goDaily: () => this.setView('daily'), goWeekly: () => this.setView('weekly'),\n      projectsScopeLabel: isDaily ? '— Thu 6/25' : '— Mon 6/22 – Sun 6/28',\n      dailyRows, weekHeads, weekRows,\n      hourlyOpen: s.hourlyOpen, chevCls: 'ch-chev' + (s.hourlyOpen ? ' on' : ''),\n      toggleHourly: () => this.setState(p => ({ hourlyOpen: !p.hourlyOpen })),\n      hourlyRows, lanes,\n      appts, apptCount: appts.length, apptOpen: s.apptOpen, apptChev: s.apptOpen ? '▼' : '▶',\n      toggleAppt: () => this.setState(p => ({ apptOpen: !p.apptOpen })),\n      typeChips, weekOptions, onWeek, cards,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
