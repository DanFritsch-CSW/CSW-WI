[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # duckdb is a native module (compiled C++ bindings) and cannot be bundled
  # by esbuild — it must be left as a runtime require() and shipped from
  # node_modules in the function's deploy artifact. Without this, any
  # `require('duckdb')` at runtime fails with "Connection Error: Connection
  # was never established" within ~6ms (the constructor throws before the
  # connection is ever attempted). Both motherduck-l4w.cjs and fefo-orders.cjs
  # depend on this. L4W has been latently broken until now because it sits
  # behind VITE_USE_MD_L4W which is not enabled in Netlify env; FEFO is the
  # first function in production to actually exercise duckdb, which is why
  # the issue only surfaced when always-live FEFO shipped.
  external_node_modules = ["duckdb"]

# Bump omni-query timeout from default 10s to 26s (Netlify max for synchronous functions).
# KEN's facility load fires the heaviest Omni query batch and during periods of Omni
# slowness can exceed the 10s default. The internal retry-on-timeout logic in
# omni-query.cjs needs room to actually retry before the function process is killed.
[functions."omni-query"]
  timeout = 26

# fefo-orders runs 3 sequential MotherDuck queries per project × up to 4 projects.
# Default 10s is too tight even with one shared duckdb connection. Bump to 26s.
[functions."fefo-orders"]
  timeout = 26

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
