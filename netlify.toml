[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # FIXED 2026-08-06: external_node_modules/included_files for duckdb,
  # @napi-rs/canvas, and dejavu-fonts-ttf used to live HERE, at the
  # top-level [functions] block -- which applies to EVERY function, not
  # just the ones that need it. duckdb's native binary alone is tens of
  # MB; copying it into all ~90 function bundles (including things like
  # front-send-email.cjs that never touch DuckDB) finally exhausted the
  # build machine's disk and took down every deploy:
  #   [Error: ENOSPC: no space left on device, write]
  # This had been a ticking time bomb since the first motherduck-*.cjs
  # function was added -- it just crossed the quota once the function
  # count grew enough. Real fix: these settings now live ONLY on the
  # per-function blocks below that actually require('duckdb') or
  # require('@napi-rs/canvas'), whether directly or transitively via a
  # shared lib/*.cjs file. Verified via `github:search_code` for
  # `require('duckdb')` and `@napi-rs/canvas` across the whole repo
  # before writing this -- not guessed. See each function block below for
  # which native-module group it needs and why.

[functions."omni-query"]
  timeout = 26

# Scheduling plugin labor insights -- added 2026-08-18. Makes a Supabase
# roster_assignments/facility_settings/employee_breaks read plus two
# chained internal function calls (scheduling-omni-appointments, and
# scheduling-omni-labor on the fallback path) -- 26s gives it the same
# headroom as omni-query itself, which it calls transitively.
[functions."scheduling-labor-planning-insights"]
  timeout = 26

# Scheduling plugin carrier list sync -- added 2026-08-19 per Kay's
# long-standing "carriers disappearing" feedback (cnv_1ayy4w9g). Weekly is
# plenty -- new carriers in Datex don't need same-day visibility, and this
# replaces the old live-on-every-load Omni query entirely. Monday 8am UTC
# (~3am Central), well outside business hours. See
# lib/carriers-sync-shared.cjs for the full root-cause writeup.
[functions."carriers-sync-run"]
  schedule = "0 8 * * 1"
  timeout = 26

# Manual test -- no schedule, so this can be POSTed directly to refresh
# the list immediately instead of waiting for Monday. NOT a dry run -- it
# really replaces scheduling_carriers' contents with a fresh Omni pull.
[functions."carriers-sync-test"]
  timeout = 26

# Order Search, Phase 1 -- added 2026-08-21 per Dan/Kay's 2026-08-20
# meeting, wired into the plugin's tab switcher 2026-08-22. Plain
# read-only POST against production_db.silver.datex_slv_orders (a silver
# view DOES exist for orders -- confirmed via direct MotherDuck catalog
# search; an earlier version of this function's comment claimed otherwise
# and was wrong), joined to silver.datex_slv_orderstatuses and
# silver.datex_slv_accounts for status/owner names, plus
# bronze.datex_projects (deduped to latest version) for project name,
# since no silver view exists for projects specifically. Same duckdb
# single-query pattern as the other motherduck-*.cjs functions above. See
# the function's own header for the full design writeup and its response
# contract (matches PluginOrderSearchTab.jsx exactly).
[functions."scheduling-order-search"]
  timeout = 26
  external_node_modules = ["duckdb"]
  included_files = ["node_modules/duckdb/**", "node_modules/@mapbox/node-pre-gyp/**", "node_modules/node-addon-api/**"]

